<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ASHA Shahayak - Local Demo Bot</title>
  <style>
    :root{font-family:system-ui,sans-serif;color:#202124;background:#dce5e8}
    body{max-width:800px;margin:0 auto;padding:24px}
    main{background:#f0f2f5;border-radius:14px;overflow:hidden;box-shadow:0 2px 12px #0002}
    .chat-header{align-items:center;background:#075e54;color:white;display:flex;gap:12px;padding:14px 18px}
    .avatar{align-items:center;background:#d9f5ed;border:2px solid #a7e5d5;border-radius:50%;display:flex;font-size:2.35rem;height:68px;justify-content:center;width:68px}
    .chat-header h1{font-size:1.45rem;margin:0}.chat-header p{display:none}
    .chat-body{padding:18px}
    .hint{color:#5f6368}
    #chat{background:#e5ddd5;border:1px solid #d2c8bf;border-radius:10px;display:flex;flex-direction:column;gap:4px;min-height:320px;padding:14px;margin:16px 0;white-space:pre-wrap}
    .msg{border-radius:8px;box-shadow:0 1px 1px #0002;max-width:82%;padding:9px 12px;position:relative}
    .msg::after{bottom:0;content:"";position:absolute}
    .user{align-self:flex-end;background:#dcf8c6;border-top-right-radius:2px;margin-left:auto}
    .user::after{border-left:7px solid #dcf8c6;border-bottom:7px solid transparent;right:-6px}
    .bot{align-self:flex-start;background:#fff;border-top-left-radius:2px;margin-right:auto}
    .bot::after{border-right:7px solid #fff;border-bottom:7px solid transparent;left:-6px}
    .error{align-self:flex-start;background:#ffe5e5;color:#9b1c1c}
    .composer{background:#f0f2f5;padding-top:4px}
    .text-composer{align-items:flex-end;display:flex;gap:8px}
    .text-composer textarea{flex:1;margin:8px 0 0}
    .text-composer #send{flex:0 0 auto;margin:8px 0 0}
    textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #bbc3d0;border-radius:8px}
    button{align-items:center;border:0;border-radius:50%;display:inline-flex;font-size:1.45rem;height:52px;justify-content:center;margin:8px 6px 0 0;padding:0;width:52px;cursor:pointer}
    #send{background:#128c7e;color:white}.voice{background:#188038;color:white}.stop{background:#d93025;color:white}
    #uploadBtn{background:#667781;color:white}
    button:disabled{opacity:.5;cursor:not-allowed}
    code{background:#f1f3f4;padding:2px 5px;border-radius:4px}
    #status{font-size:.9rem}.error{color:#b3261e}
    @media (max-width:600px){
      body{padding:0}
      main{border-radius:0;min-height:100vh}
      .chat-header{padding:12px 14px}
      .chat-body{padding:12px}
      #chat{border-radius:8px;min-height:calc(100vh - 330px);padding:10px}
      .msg{max-width:88%;padding:10px 11px}
      .hint{font-size:.9rem;margin:8px 0}
      .composer{padding-bottom:env(safe-area-inset-bottom,8px)}
      .text-composer{gap:6px}
      .text-composer textarea{font-size:16px;min-height:52px;resize:none}
      button{height:54px;width:54px}
      .composer > div:last-of-type{display:flex;gap:4px;justify-content:flex-start}
      .composer > div:last-of-type button{margin-right:2px}
    }
  </style>
</head>
<body>
<main>
  <header class="chat-header">
    <div class="avatar" role="img" aria-label="ASHA worker">👩🏽‍⚕️</div>
    <div><h1>ASHA Shahayak</h1><p id="status">Checking local bot...</p></div>
  </header>
  <div class="chat-body">
  <p class="hint">बोलकर हमें अपनी समस्या भेजिए</p>
  <section id="chat" aria-live="polite"><div class="msg bot">नमस्ते। मैं ASHA Shahayak हूँ।<br><small>उदाहरण: vaccination july count 3 amount 250</small></div></section>
  <div class="composer">
  <div class="text-composer">
  <textarea id="text" rows="3" placeholder="अपना message लिखें..."></textarea>
  <button id="send" type="button" aria-label="Send text" title="Send text">➤</button>
  </div>
  <div>
    <button id="record" class="voice" type="button" aria-label="Start voice note" title="Start voice note">🎙</button>
    <button id="stop" class="stop" type="button" aria-label="Stop and send voice note" title="Stop and send voice note" disabled>■</button>
    <button id="uploadBtn" type="button" aria-label="Upload audio file" title="Upload audio file">📎</button>
    <input id="audioFile" type="file" accept="audio/*,.mp3,.wav,.m4a,.ogg" hidden>
  </div>
  </div>
  </div>
</main>
<script>
const chat = document.querySelector("#chat");
const status = document.querySelector("#status");
const text = document.querySelector("#text");
const send = document.querySelector("#send");
const record = document.querySelector("#record");
const stop = document.querySelector("#stop");
const uploadBtn = document.querySelector("#uploadBtn");
const audioFile = document.querySelector("#audioFile");
let recorder;
let chunks = [];

function addMessage(kind, value) {
  const item = document.createElement("div");
  item.className = `msg ${kind}`;
  item.textContent = value;
  chat.appendChild(item);
  chat.scrollTop = chat.scrollHeight;
}

async function sendText() {
  const value = text.value.trim();
  if (!value) return;
  addMessage("user", value);
  text.value = "";
  try {
    const response = await fetch("/api/text", {
      method: "POST",
      headers: {"content-type": "application/json"},
      body: JSON.stringify({text: value})
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.detail || "Text request failed");
    addMessage("bot", data.reply + `\nReceipt: ${data.receipt_id}`);
  } catch (error) {
    addMessage("bot error", error.message);
  }
}

send.onclick = sendText;
text.onkeydown = (event) => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendText();
  }
};

async function sendVoiceBlob(audio) {
  addMessage("user", "[Voice note sent]");
  status.textContent = "Transcribing voice...";
  try {
    const response = await fetch("/api/voice", {
      method: "POST",
      headers: {"content-type": audio.type || "application/octet-stream"},
      body: audio
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.detail || "Voice request failed");
    addMessage("bot", data.ok ? `मैंने सुना: "${data.transcript}"\n${data.reply}\nReceipt: ${data.receipt_id}` : data.error);
  } catch (error) {
    addMessage("bot error", error.message);
  } finally {
    status.textContent = "Ready";
  }
}

record.onclick = async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio: true});
    recorder = new MediaRecorder(stream);
    chunks = [];
    recorder.ondataavailable = (event) => chunks.push(event.data);
    recorder.onstop = async () => {
      stream.getTracks().forEach((track) => track.stop());
      const audio = new Blob(chunks, {type: recorder.mimeType || "audio/webm"});
      await sendVoiceBlob(audio);
    };
    recorder.start();
    record.disabled = true;
    stop.disabled = false;
    status.textContent = "Recording...";
  } catch (error) {
    addMessage("bot error", `Microphone permission failed: ${error.message}`);
  }
};

stop.onclick = () => {
  if (recorder && recorder.state === "recording") recorder.stop();
  record.disabled = false;
  stop.disabled = true;
};

uploadBtn.onclick = () => audioFile.click();

audioFile.onchange = async () => {
  const file = audioFile.files[0];
  if (!file) return;
  await sendVoiceBlob(file);
  audioFile.value = "";
};

fetch("/api/health").then((response) => response.json()).then((data) => {
  status.textContent = data.voice_transcription ? "तैयार - text और voice दोनों चालू हैं ( prototype bot )" : "तैयार - text चालू है, voice के लिए Sarvam key चाहिए ( prototype bot )";
}).catch(() => {
  status.textContent = "Bot server चालू नहीं है";
});
</script>
</body>
</html>
