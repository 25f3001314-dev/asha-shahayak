<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ASHA Shahayak - Demo Bot</title>
  <link rel="icon" href="data:,">
  <style>
    :root{font-family:system-ui,sans-serif;color:#202124;background:#dce5e8}
    body{max-width:800px;margin:0 auto;padding:24px}
    main{background:#f0f2f5;border-radius:14px;overflow:hidden;box-shadow:0 2px 12px #0002}
    .chat-header{align-items:center;background:#075e54;color:white;display:flex;gap:12px;padding:14px 18px}
    .avatar{align-items:center;background:#d9f5ed;border:2px solid #a7e5d5;border-radius:50%;display:flex;font-size:2.35rem;height:68px;justify-content:center;width:68px;flex:0 0 68px}
    .chat-header h1{font-size:1.45rem;margin:0}
    .chat-header p{font-size:.82rem;margin:3px 0 0;opacity:.9}
    .chat-body{padding:18px}
    .hint{color:#5f6368}
    #chat{background:#e5ddd5;border:1px solid #d2c8bf;border-radius:10px;display:flex;flex-direction:column;gap:6px;min-height:320px;max-height:60vh;overflow-y:auto;padding:14px;margin:16px 0;white-space:pre-wrap}
    .msg{border-radius:8px;box-shadow:0 1px 1px #0002;max-width:82%;padding:9px 12px;position:relative}
    .user{align-self:flex-end;background:#dcf8c6;border-top-right-radius:2px;margin-left:auto}
    .bot{align-self:flex-start;background:#fff;border-top-left-radius:2px;margin-right:auto}
    .msg.error{background:#ffe5e5;color:#9b1c1c}
    .composer{background:#f0f2f5;padding-top:4px}
    .text-composer{align-items:flex-end;display:flex;gap:8px}
    .text-composer textarea{flex:1;margin:8px 0 0}
    .text-composer #send{flex:0 0 auto;margin:8px 0 0}
    textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #bbc3d0;border-radius:8px;font:inherit}
    button{align-items:center;border:0;border-radius:50%;display:inline-flex;font-size:1.45rem;height:52px;justify-content:center;margin:8px 6px 0 0;padding:0;width:52px;cursor:pointer}
    #send{background:#128c7e;color:white}.voice{background:#188038;color:white}.stop{background:#d93025;color:white}
    #uploadBtn{background:#667781;color:white}
    #speakToggle{background:#667781;color:white}
    #speakToggle.on{background:#1a73e8}
    button:disabled{opacity:.5;cursor:not-allowed}
    .msg .play{background:#e7f4f1;border-radius:14px;color:#075e54;display:block;font-size:.9rem;height:auto;margin:8px 0 0;padding:5px 12px;width:auto}
    .recording{animation:pulse 1s infinite}
    @keyframes pulse{50%{opacity:.55}}
    @media (max-width:600px){
      body{padding:0}
      main{border-radius:0;min-height:100vh}
      .chat-header{padding:12px 14px}
      .chat-body{padding:12px}
      #chat{border-radius:8px;min-height:calc(100vh - 360px);padding:10px}
      .msg{max-width:88%;padding:10px 11px}
      .hint{font-size:.9rem;margin:8px 0}
      .composer{padding-bottom:env(safe-area-inset-bottom,8px)}
      .text-composer{gap:6px}
      .text-composer textarea{font-size:16px;min-height:52px;resize:none}
      button{height:54px;width:54px}
    }
  </style>
</head>
<body>
<main>
  <header class="chat-header">
    <div class="avatar" role="img" aria-label="ASHA worker">👩🏽‍⚕️</div>
    <div><h1>ASHA Shahayak</h1><p id="status">Server से जुड़ रहे हैं...</p></div>
  </header>
  <div class="chat-body">
  <p class="hint">बोलकर या लिखकर अपनी समस्या भेजिए। पहले अपनी ID बताइए, जैसे “ASHA-106”।</p>
  <section id="chat" aria-live="polite"><div class="msg bot">नमस्ते। मैं ASHA Shahayak हूँ।<br><small>उदाहरण: ASHA-106, फिर “इसका पेमेंट बताओ”</small></div></section>
  <div class="composer">
  <div class="text-composer">
  <textarea id="text" rows="3" placeholder="अपना message लिखें..."></textarea>
  <button id="send" type="button" aria-label="Send text" title="Send text">➤</button>
  </div>
  <div>
    <button id="record" class="voice" type="button" aria-label="Start voice note" title="बोलना शुरू करें">🎙</button>
    <button id="stop" class="stop" type="button" aria-label="Stop and send voice note" title="रोकें और भेजें" disabled>■</button>
    <button id="uploadBtn" type="button" aria-label="Upload audio file" title="Audio file भेजें">📎</button>
    <button id="speakToggle" type="button" aria-label="Speak text replies" title="Text के जवाब भी बोलकर सुनाएँ">🔈</button>
    <input id="audioFile" type="file" accept="audio/*,.mp3,.wav,.m4a,.ogg,.webm" hidden>
  </div>
  </div>
  </div>
</main>
<script>
const chat = document.querySelector("#chat");
const statusEl = document.querySelector("#status");
const text = document.querySelector("#text");
const sendBtn = document.querySelector("#send");
const recordBtn = document.querySelector("#record");
const stopBtn = document.querySelector("#stop");
const uploadBtn = document.querySelector("#uploadBtn");
const audioFile = document.querySelector("#audioFile");
const speakToggle = document.querySelector("#speakToggle");

const MAX_RECORD_SECONDS = 25;   // Sarvam's REST speech-to-text accepts clips under 30 seconds
const MIN_RECORD_SECONDS = 1;
const SILENT_WAV = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA=";

let recorder = null;
let chunks = [];
let recordTimer = null;
let recordStarted = 0;
let busy = false;
let serverReady = false;
let voiceReady = true;
const player = new Audio();      // one shared player; unlocked on the first tap so phones allow autoplay

function makeSessionId() {
  const raw = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now().toString(36) + Math.random().toString(36).slice(2));
  return raw.replace(/[^A-Za-z0-9_-]/g, "").padEnd(8, "0").slice(0, 64);
}
let sessionId;
try {
  sessionId = sessionStorage.getItem("asha_sid") || makeSessionId();
  sessionStorage.setItem("asha_sid", sessionId);
} catch (e) { sessionId = makeSessionId(); }

let speakText = false;
try { speakText = sessionStorage.getItem("asha_speak") === "1"; } catch (e) {}
function paintSpeakToggle() {
  speakToggle.classList.toggle("on", speakText);
  speakToggle.textContent = speakText ? "🔊" : "🔈";
}
paintSpeakToggle();
speakToggle.onclick = () => {
  unlockAudio();
  speakText = !speakText;
  try { sessionStorage.setItem("asha_speak", speakText ? "1" : "0"); } catch (e) {}
  paintSpeakToggle();
  setStatus(speakText ? "अब जवाब बोलकर भी सुनाया जाएगा" : "जवाब सिर्फ़ text में आएगा");
};

function setStatus(value) { statusEl.textContent = value; }

function unlockAudio() {
  try { player.src = SILENT_WAV; player.play().catch(() => {}); } catch (e) {}
}

function playAudio(base64, mime) {
  try {
    player.pause();
    player.src = `data:${mime || "audio/wav"};base64,${base64}`;
    return player.play();
  } catch (e) {
    return Promise.reject(e);
  }
}

function addMessage(kind, value, audio) {
  const item = document.createElement("div");
  item.className = `msg ${kind}`;
  item.textContent = value;
  if (audio) {
    const play = document.createElement("button");
    play.type = "button";
    play.className = "play";
    play.textContent = "🔊 जवाब सुनें";
    play.onclick = () => playAudio(audio.base64, audio.mime).catch(() => setStatus("Audio चल नहीं पाया, text पढ़ें"));
    item.appendChild(play);
  }
  chat.appendChild(item);
  chat.scrollTop = chat.scrollHeight;
  return item;
}

async function api(path, options = {}, timeoutMs = 30000) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  try {
    const response = await fetch(path, {
      ...options,
      signal: controller.signal,
      headers: {...(options.headers || {}), "x-session-id": sessionId}
    });
    const raw = await response.text();
    let data = null;
    try { data = JSON.parse(raw); } catch (e) {}
    if (!data) {
      // Render's free plan sleeps; the proxy then answers with an HTML error page.
      throw new Error("Server अभी जाग रहा है, 30 सेकंड बाद दोबारा भेजें।");
    }
    if (!response.ok) {
      throw new Error(typeof data.detail === "string" ? data.detail : "Request fail हो गया, दोबारा कोशिश करें।");
    }
    return data;
  } catch (error) {
    if (error.name === "AbortError") throw new Error("जवाब आने में बहुत देर लगी, दोबारा कोशिश करें।");
    if (error instanceof TypeError) throw new Error("Internet या server से connection नहीं हो पाया।");
    throw error;
  } finally {
    clearTimeout(timer);
  }
}

function showReply(data) {
  const audio = data.audio_base64 ? {base64: data.audio_base64, mime: data.audio_mime} : null;
  addMessage("bot", data.reply + `\nReceipt: ${data.receipt_id}`, audio);
  if (audio) {
    playAudio(audio.base64, audio.mime).catch(() => setStatus("जवाब सुनने के लिए 🔊 बटन दबाएँ"));
  } else if (data.audio_error) {
    setStatus(data.audio_error);
  }
}

function setBusy(value) {
  busy = value;
  sendBtn.disabled = value;
  uploadBtn.disabled = value;
  recordBtn.disabled = value || !!recorder;
}

async function sendText() {
  const value = text.value.trim();
  if (!value || busy) return;
  unlockAudio();
  addMessage("user", value);
  text.value = "";
  setBusy(true);
  setStatus("जवाब तैयार हो रहा है...");
  try {
    const data = await api("/api/text", {
      method: "POST",
      headers: {"content-type": "application/json"},
      body: JSON.stringify({text: value, speak: speakText})
    }, 60000);
    showReply(data);
    setStatus("तैयार");
  } catch (error) {
    addMessage("bot error", error.message);
    setStatus("तैयार");
  } finally {
    setBusy(false);
  }
}

sendBtn.onclick = sendText;
text.onkeydown = (event) => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendText();
  }
};

async function sendVoiceBlob(audio) {
  const bubble = addMessage("user", "🎙 आवाज़ भेजी गई...");
  setBusy(true);
  setStatus("आवाज़ सुनी जा रही है...");
  try {
    const data = await api("/api/voice", {
      method: "POST",
      headers: {"content-type": audio.type || "application/octet-stream"},
      body: audio
    }, 110000);
    if (!data.ok) {
      bubble.textContent = "🎙 (आवाज़ समझ नहीं आई)";
      addMessage("bot error", data.error || "आवाज़ समझ नहीं आई, दोबारा बोलें या text भेजें।");
    } else {
      bubble.textContent = `🎙 ${data.transcript}`;
      showReply(data);
    }
    setStatus("तैयार");
  } catch (error) {
    bubble.textContent = "🎙 (आवाज़ नहीं भेजी जा सकी)";
    addMessage("bot error", error.message);
    setStatus("तैयार");
  } finally {
    setBusy(false);
  }
}

function pickRecorderType() {
  if (!window.MediaRecorder || !MediaRecorder.isTypeSupported) return "";
  const options = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg;codecs=opus"];
  return options.find((type) => MediaRecorder.isTypeSupported(type)) || "";
}

function finishRecordingUi() {
  clearInterval(recordTimer);
  recordTimer = null;
  recordBtn.classList.remove("recording");
  recordBtn.disabled = busy;
  stopBtn.disabled = true;
}

recordBtn.onclick = async () => {
  if (busy || recorder) return;
  unlockAudio();
  if (!navigator.mediaDevices || !window.MediaRecorder) {
    addMessage("bot error", "इस browser में recording नहीं चलती। Chrome या Safari (https) में खोलें, या 📎 से audio भेजें।");
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio: true});
    const mimeType = pickRecorderType();
    recorder = mimeType ? new MediaRecorder(stream, {mimeType}) : new MediaRecorder(stream);
    chunks = [];
    recorder.ondataavailable = (event) => { if (event.data && event.data.size) chunks.push(event.data); };
    recorder.onstop = async () => {
      stream.getTracks().forEach((track) => track.stop());
      const seconds = (Date.now() - recordStarted) / 1000;
      const type = (recorder && recorder.mimeType) || mimeType || "audio/webm";
      recorder = null;
      finishRecordingUi();
      if (seconds < MIN_RECORD_SECONDS || !chunks.length) {
        setStatus("तैयार");
        addMessage("bot error", "आवाज़ बहुत छोटी थी, बटन दबाकर कम से कम 2 सेकंड बोलें।");
        return;
      }
      await sendVoiceBlob(new Blob(chunks, {type}));
    };
    recorder.start();
    recordStarted = Date.now();
    recordBtn.disabled = true;
    recordBtn.classList.add("recording");
    stopBtn.disabled = false;
    recordTimer = setInterval(() => {
      const seconds = Math.floor((Date.now() - recordStarted) / 1000);
      setStatus(`रिकॉर्ड हो रहा है... ${seconds}s (■ दबाकर भेजें)`);
      if (seconds >= MAX_RECORD_SECONDS && recorder && recorder.state === "recording") recorder.stop();
    }, 500);
    setStatus("रिकॉर्ड हो रहा है...");
  } catch (error) {
    recorder = null;
    finishRecordingUi();
    addMessage("bot error", `Microphone चालू नहीं हो पाया: ${error.message}. Browser में mic permission दें।`);
  }
};

stopBtn.onclick = () => {
  if (recorder && recorder.state === "recording") recorder.stop();
};

uploadBtn.onclick = () => { unlockAudio(); audioFile.click(); };

audioFile.onchange = async () => {
  const file = audioFile.files[0];
  if (!file) return;
  await sendVoiceBlob(file);
  audioFile.value = "";
};

async function checkHealth(attempt = 0) {
  try {
    const data = await api("/api/health", {}, 15000);
    serverReady = true;
    voiceReady = !!data.voice_transcription;
    const notes = [];
    if (!voiceReady) notes.push("voice के लिए Sarvam key चाहिए");
    if (data.registry_count === 0) notes.push("dashboard से ASHA data upload करें");
    if (data.session_salt_set === false) notes.push("ASHA_SESSION_SALT सेट नहीं है");
    setStatus(notes.length ? `तैयार - ${notes.join(", ")}` : "तैयार - text और voice (सुनना + बोलना) चालू हैं");
  } catch (error) {
    if (attempt < 20) {
      setStatus("Server जाग रहा है, कृपया रुकें...");
      setTimeout(() => checkHealth(attempt + 1), 4000);
    } else {
      setStatus("Bot server चालू नहीं है");
    }
  }
}
checkHealth();
</script>
</body>
</html>
